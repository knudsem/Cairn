# Conteneurs de Cairn, décrits pour Docker Compose.
# Lancement complet : docker compose up --build
#
# navigateur -> web (Blazor, port 8081) -> api (Go, port 8080) -> db (PostgreSQL, port 5432)
#
# Chaque port n'est publié que sur 127.0.0.1 : joignable depuis ce poste,
# jamais depuis le réseau. Côté Windows, se connecter avec 127.0.0.1 plutôt
# que localhost (voir docs/PLAN.md, section 2.1). Entre conteneurs, chaque
# service se joint par son nom : db, api.

services:
  db:
    # Version majeure fixée : les versions mineures 18.x n'apportent que
    # des correctifs.
    image: postgres:18
    environment:
      # Identifiants d'un prototype local, sans valeur secrète. L'image crée
      # l'utilisateur et la base au premier démarrage.
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Données de la base, conservées d'un démarrage à l'autre.
      # Avec PostgreSQL 18, le volume se monte sur /var/lib/postgresql.
      # "docker compose down -v" supprime ce volume : la base repart de zéro.
      - db-data:/var/lib/postgresql
      # Scripts SQL exécutés par l'image dans l'ordre alphabétique, une seule
      # fois, quand le volume est vide. Montés en lecture seule (ro).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # « Prête » seulement après l'initialisation : pendant celle-ci, le
      # serveur temporaire n'écoute pas sur le réseau, et -h 127.0.0.1 oblige
      # pg_isready à passer par le réseau. -U cairn évite l'erreur
      # « role "root" does not exist » dans les journaux.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cairn"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    # Image construite à partir de api/Dockerfile.
    build: ./api
    environment:
      DATABASE_URL: postgres://cairn:cairn@db:5432/cairn?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      # L'API ne démarre qu'une fois la base prête.
      db:
        condition: service_healthy
    healthcheck:
      # « Prête » quand GET /health répond 200, donc quand l'API et la base
      # répondent. wget est fourni par Alpine.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    # Image construite à partir de web/Dockerfile.
    build: ./web
    environment:
      ApiBaseUrl: http://api:8080/
    ports:
      # Le conteneur écoute sur 8080, publié sur le port 8081 du poste.
      - "127.0.0.1:8081:8080"
    depends_on:
      # L'interface ne démarre qu'une fois l'API prête.
      api:
        condition: service_healthy

volumes:
  db-data:
