# Déploiement de Cairn sur Render (docs/PLAN.md, étapes 11 et 11 ter) : un
# seul service web Docker, offre gratuite, région Francfort. Il fait tourner
# l'API Go et l'interface Blazor dans le même conteneur (render/Dockerfile) :
# quand un visiteur ouvre le site, Render réveille ce service, et l'API
# démarre avec l'interface. La base est sur Neon.
#
# En local, rien ne change : compose.yaml garde les services db, api et web
# séparés.
#
# Aucun secret ici : avec sync: false, la valeur est saisie dans le tableau de
# bord de Render, jamais écrite dans le dépôt.
services:
  - type: web
    # Le nom donne l'adresse https://cairn-knudsem-web.onrender.com, inchangée
    # depuis l'étape 11.
    name: cairn-knudsem-web
    runtime: docker
    plan: free
    region: frankfurt
    # Construction depuis la racine du dépôt, car l'image compile api/ et web/ ;
    # le fichier .dockerignore de la racine ne laisse passer que le nécessaire.
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    # Reconstruit l'image seulement si un fichier qui y entre change.
    buildFilter:
      paths:
        - api/**
        - web/**
        - render/**
        - .dockerignore
    envVars:
      # Port public de l'interface : la valeur par défaut de Render. L'API, elle,
      # écoute sur 127.0.0.1:9000, à l'intérieur du conteneur seulement
      # (render/start.sh, qui règle aussi l'adresse de l'API et coupe le réveil
      # par le navigateur).
      - key: PORT
        value: "10000"
      # Chaîne de connexion directe de Neon, avec sslmode=require et
      # channel_binding=require. Elle contient le mot de passe. Seule l'API
      # s'en sert : par hygiène, render/start.sh la retire de l'environnement
      # de l'interface.
      # Render ne demande une valeur sync: false qu'à la création du Blueprint :
      # pour ce service, elle se saisit dans le tableau de bord.
      - key: DATABASE_URL
        sync: false
      # Délai d'un appel de l'interface à l'API, nouveaux essais des lectures
      # compris (étape 11 bis) : couvre les quelques secondes de démarrage de
      # l'API dans le conteneur et le réveil de la base Neon.
      - key: ApiTimeoutSeconds
        value: "30"
      # Remise à zéro de la démo par les testeurs (étape 15). Les deux
      # programmes du conteneur la lisent : l'API déclare POST
      # /api/demo/reset, l'interface affiche le bouton « Réinitialiser la
      # démo ». Absente ou différente de true : ni route, ni bouton.
      - key: DEMO_RESET_ENABLED
        value: "true"
